name: Secret Scan

on: [push]

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Scan for secrets
        run: |
          if grep -rEi "(password|senha|token|secret)\s*=\s*[^$][^ {]" src/; then
            echo "❌ SEGREDO REAL DETECTADO"
            exit 1
          fi  