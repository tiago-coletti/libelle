name: CI - Build & Test

on:
  push:
    branches: [kelvin, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: libelle
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Dar permissão no mvnw
        run: chmod +x mvnw

      - name: Build
        run: ./mvnw clean package -DskipTests

      - name: Run App
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/libelle
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: |
          ./mvnw spring-boot:run > app.log 2>&1 &
          echo $! > app.pid

      - name: Aguardar app subir
        run: |
          echo "Aguardando app iniciar..."
          for i in $(seq 1 24); do
            if curl -s http://localhost:8080 > /dev/null 2>&1; then
              echo "App respondendo após $((i * 5))s"
              exit 0
            fi
            echo "Tentativa $i/24 - aguardando 5s..."
            sleep 5
          done
          echo "App não subiu em 120s. Log:"
          cat app.log
          exit 1

      - name: Test Endpoint
        run: |
          curl --fail http://localhost:8080 || exit 1