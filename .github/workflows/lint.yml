name: Code Quality

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Dar permissão no mvnw
        run: chmod +x mvnw

      - name: Run Checkstyle
        run: ./mvnw checkstyle:check
        continue-on-error: true   # remove esta linha quando o código estiver limpo
