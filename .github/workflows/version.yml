name: Auto Version by Merge

on:
  push:
    branches:
      - main

jobs:
  version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Get last tag
        id: tag
        run: |
          git fetch --tags
          TAG=$(git tag | sort -V | tail -n 1)
          echo "last_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Get merge commit message
        id: msg
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "msg=$MSG" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump
        run: |
          TAG=${{ steps.tag.outputs.last_tag }}
          MSG="${{ steps.msg.outputs.msg }}"

          if [ -z "$TAG" ]; then
            NEW_TAG="v1.0.0"
          else
            VERSION=${TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            if [[ "$MSG" == *"BREAKING"* ]]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            elif [[ "$MSG" == *"feat"* ]]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi

            NEW_TAG="v$MAJOR.$MINOR.$PATCH"
          fi

          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag ${{ steps.bump.outputs.new_tag }}
          git push origin ${{ steps.bump.outputs.new_tag }}